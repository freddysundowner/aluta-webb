kind = "web"
previewPath = "/"
title = "Aluta Technology Ventures"
version = "1.0.0"
id = "artifacts/aluta-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23893

[services.development]
run = "pnpm --filter @workspace/aluta-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aluta-website", "run", "build" ]
publicDir = "artifacts/aluta-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23893"
BASE_PATH = "/"
